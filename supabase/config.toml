# Supabase CLI settings for the A Challenge to Move running-plan functions (project olncfwohfpgpmygxjpcm).
# Only the function JWT settings are set here; link with: supabase link --project-ref olncfwohfpgpmygxjpcm
[functions.ladder-checkout]
verify_jwt = false   # sign-in optional; the function verifies a JWT itself when one is sent

[functions.ladder-stripe-webhook]
verify_jwt = false   # Stripe calls it; verified with the Stripe signature instead

[functions.ladder-redeem-gift]
verify_jwt = true

[functions.ladder-gift-code]
verify_jwt = true
